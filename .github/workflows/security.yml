name: Security & Secret Hygiene

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Repository Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # gitleaks/gitleaks-action pinned to commit SHA (v2.3.4)
      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@512686008eb27928e3b08e5e771d9d784a92c00c # v2.3.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true # Safe fallback during initial scaffolding if token lacks org permissions
